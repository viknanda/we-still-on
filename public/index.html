<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f0c4a8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="hang" />
    <link rel="manifest" href="/manifest.webmanifest?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png?v=2" />
    <title>{{OG_TITLE}}</title>
    <meta name="description" content="{{OG_DESC}}" />
    <meta property="og:title" content="{{OG_TITLE}}" />
    <meta property="og:description" content="{{OG_DESC}}" />
    <meta property="og:url" content="{{OG_URL}}" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{OG_TITLE}}" />
    <meta name="twitter:description" content="{{OG_DESC}}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <main class="wrap">
      <div id="land" class="screen land" hidden>
        <div class="land-hero">
          <button type="button" class="blast" id="start">
            <span class="blast-title">
              <span class="blast-line">we</span>
              <span class="blast-line">still</span>
              <span class="blast-line">on?</span>
            </span>
            <span class="hint">tap to start a hang</span>
          </button>
        </div>
        <section class="pulse" aria-label="data minima">
          <p class="pulse-label">data minima. hangs created. hangs gone.</p>
          <svg
            id="pulse-chart"
            class="pulse-chart"
            viewBox="0 0 320 72"
            width="320"
            height="72"
            preserveAspectRatio="none"
            aria-hidden="true"
          ></svg>
          <div class="pulse-foot">
            <button
              type="button"
              class="help"
              id="help"
              aria-label="what is wsowso"
              aria-haspopup="dialog"
              aria-controls="demo"
              aria-expanded="false"
            >
              wsowso wat
            </button>
            <div class="pulse-meta">
              <span class="pulse-key pulse-key-created">created</span>
              <span class="pulse-key pulse-key-gone">gone</span>
              <span id="pulse-live" class="pulse-live">0 live</span>
            </div>
          </div>
        </section>
      </div>

      <div id="hang" class="screen hang" hidden>
        <input
          id="who"
          class="name"
          type="text"
          name="who"
          maxlength="48"
          autocomplete="off"
          autocorrect="off"
          enterkeyhint="done"
          autocapitalize="words"
          spellcheck="false"
          placeholder="your name"
          value=""
        />
        <input
          id="line"
          class="hangline"
          type="text"
          maxlength="64"
          autocomplete="off"
          enterkeyhint="done"
          autocapitalize="sentences"
          spellcheck="false"
          placeholder="what's the hang"
        />
        <p id="frozen" class="hangline frozen" hidden></p>
        <div class="lanes">
          <button type="button" class="row" data-status="yes">
            <span class="head">
              <span class="word">Yes</span>
              <span class="count" data-count="yes">0</span>
            </span>
            <span class="names" data-status="yes"></span>
          </button>
          <button type="button" class="row" data-status="late">
            <span class="head">
              <span class="word">Late</span>
              <span class="count" data-count="late">0</span>
            </span>
            <span class="names" data-status="late"></span>
          </button>
          <button type="button" class="row" data-status="out">
            <span class="head">
              <span class="word">Out</span>
              <span class="count" data-count="out">0</span>
            </span>
            <span class="names" data-status="out"></span>
          </button>
        </div>
        <div class="expire-row">
          <span class="expire-label">this hang lives for</span>
          <div
            id="expire"
            class="expire"
            role="radiogroup"
            aria-label="this hang lives for"
          >
            <button
              type="button"
              class="expire-opt"
              role="radio"
              data-hours="1"
              aria-checked="true"
            >
              1h
            </button>
            <button
              type="button"
              class="expire-opt"
              role="radio"
              data-hours="24"
              aria-checked="false"
            >
              24h
            </button>
          </div>
        </div>
        <div id="after" class="after" hidden>
          <button type="button" class="copy" id="copy">Copy link</button>
          <button type="button" class="yours" id="yours">Start yours</button>
        </div>
      </div>

      <div id="gone" class="screen land" hidden>
        <button type="button" class="blast" id="again">
          <span class="blast-title">
            <span class="blast-line">hang</span>
            <span class="blast-line">404'd</span>
          </span>
          <span class="hint">tap to start a hang</span>
        </button>
      </div>
    </main>

    <div
      id="demo"
      class="demo"
      role="dialog"
      aria-modal="true"
      aria-labelledby="demo-caption"
      hidden
    >
      <button type="button" class="demo-scrim" id="demo-scrim" tabindex="-1" aria-label="Close"></button>
      <div class="demo-sheet">
        <button type="button" class="demo-close" id="demo-close" aria-label="Close">
          ×
        </button>
        <div class="demo-phone" aria-hidden="true">
          <div class="demo-stage" id="demo-stage" data-beat="land">
            <div class="demo-land">
              <p class="demo-blast">
                <span>we</span>
                <span>still</span>
                <span>on?</span>
              </p>
              <p class="demo-hint">tap to start a hang</p>
              <span class="demo-tap"></span>
            </div>
            <div class="demo-hang">
              <p class="demo-name" id="demo-name"></p>
              <p class="demo-line" id="demo-line"></p>
              <div class="demo-lanes">
                <div class="demo-row" data-status="yes">
                  <span class="demo-head">
                    <span class="demo-word">Yes</span>
                    <span class="demo-count" id="demo-yes-n">0</span>
                  </span>
                  <span class="demo-names" id="demo-yes"></span>
                </div>
                <div class="demo-row" data-status="late">
                  <span class="demo-head">
                    <span class="demo-word">Late</span>
                    <span class="demo-count" id="demo-late-n">0</span>
                  </span>
                  <span class="demo-names" id="demo-late"></span>
                </div>
                <div class="demo-row" data-status="out">
                  <span class="demo-head">
                    <span class="demo-word">Out</span>
                    <span class="demo-count" id="demo-out-n">0</span>
                  </span>
                  <span class="demo-names" id="demo-out"></span>
                </div>
              </div>
              <p class="demo-copy" id="demo-copy">Copy link</p>
            </div>
          </div>
        </div>
        <p class="demo-caption" id="demo-caption">tap to start a hang</p>
      </div>
    </div>

    <p id="err" class="err" hidden></p>
    <script src="/app.js" type="module"></script>
  </body>
</html>
