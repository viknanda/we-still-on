<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "Barlow Condensed";
        src: url("./fonts/BarlowCondensed-ExtraBold.ttf") format("truetype");
        font-weight: 800;
        font-style: normal;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
      }
      .frame {
        width: 1024px;
        height: 1024px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(
          135deg,
          #f0c4a8 0%,
          #f3d5bc 42%,
          #c9e8d6 78%,
          #b5dfc9 100%
        );
      }
      .grain {
        pointer-events: none;
        position: absolute;
        inset: 0;
        opacity: 0.38;
        mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-size: 160px 160px;
      }
      .blast {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        /* mirror .wrap + .blast: left-led column, tight leading */
        padding: 140px 96px 140px 112px;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 0.06em;
        text-align: left;
        font-family: "Barlow Condensed", sans-serif;
        font-size: 292px;
        line-height: 1;
        letter-spacing: 0.01em;
        font-weight: 800;
        color: #0e0e0e;
        -webkit-font-smoothing: antialiased;
      }
      .blast-line {
        display: block;
        line-height: 1;
        padding-bottom: 0.04em;
        margin-bottom: -0.04em;
      }
    </style>
  </head>
  <body>
    <div class="frame" id="frame">
      <div class="grain" aria-hidden="true"></div>
      <p class="blast">
        <span class="blast-line">we</span>
        <span class="blast-line">still</span>
        <span class="blast-line">on?</span>
      </p>
    </div>
  </body>
</html>
