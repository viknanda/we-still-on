app = "we-still-on"
primary_region = "sjc"

[build]

[deploy]
  # In-memory hangs require a single machine. Redeploy with: fly deploy --ha=false
  wait_timeout = "5m"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
